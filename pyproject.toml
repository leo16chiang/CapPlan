[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capplan"
version = "0.1.0"
description = "Prime-time peak MIPS forecasting for z/OS capacity planning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "duckdb>=0.10",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Stage 1 neural backend. torch is a large wheel -- confirm the internal mirror
# carries it before promising this path (see docs/week1_checklist.md).
neural = ["torch>=2.1", "neuralforecast>=1.7"]
# Baseline gate.
baselines = ["statsforecast>=1.7", "lightgbm>=4.0"]
polars = ["polars>=0.20"]
dev = ["pytest>=7.4"]

[project.scripts]
capplan = "capplan.cli:main"

[tool.setuptools.packages.find]
include = ["capplan*"]

[tool.setuptools.package-data]
capplan = ["diagnostics/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
